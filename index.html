/* ============================================================================
   OCR BRILLANCE — SOCLE COMMUN · ocr-tokens.css
   ----------------------------------------------------------------------------
   Charte de marque 2026 traduite en variables et composants.
   Le site vitrine, l'application client et l'application interne importent
   CE fichier. Une couleur ne se modifie qu'ici.

   Corrections intégrées d'office (revue du 11 août 2026) :
   · --ocr-rouge-texte pour le petit texte (le rouge de marque plafonne à 3,85:1)
   · surfaces surélevées + filet, pour que les cartes tiennent en plein soleil
   · :focus-visible sur tous les éléments interactifs
   · plancher typographique à 12 px
   · quatre rayons au lieu de cinq

   Version 1.0.0 — 11 août 2026
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Manrope:wght@400;600;800&display=swap');

:root {
  /* ── Couleurs de marque ─────────────────────────────────── */
  --ocr-noir:          #0A0A0B;   /* Noir laqué — fond dominant           */
  --ocr-noir-2:        #101012;   /* Fond de section alterné               */
  --ocr-surface:       #16161A;   /* Cartes                                */
  --ocr-surface-haute: #1E1E22;   /* Élevé : champs, survol, feuilles      */
  --ocr-filet:         #232327;   /* Bordures et séparateurs               */

  --ocr-blanc:         #F4F4F5;   /* Blanc pur — 18,0:1                    */
  --ocr-argent:        #9A9CA0;   /* Argent mat — 7,2:1                    */
  --ocr-argent-2:      #6E7075;   /* Légendes — 4,0:1, jamais sous 12 px   */

  --ocr-rouge:         #D6201E;   /* Rouge OCR — aplats, gros titres, UI   */
  --ocr-rouge-clair:   #E5342F;   /* Survol                                */
  --ocr-rouge-texte:   #E8524E;   /* 5,4:1 — le SEUL rouge pour du texte   */
  --ocr-rouge-profond: #7E1113;   /* Fin de dégradé uniquement             */

  --ocr-vert:          #37C26B;   /* Succès — 8,6:1                        */
  --ocr-ambre:         #F5A623;   /* Avertissement — 9,8:1                 */
  --ocr-erreur:        #E8524E;   /* Erreur = rouge texte + icône + libellé*/

  --ocr-grad-rouge:  linear-gradient(180deg, #E5342F 0%, #D6201E 45%, #7E1113 100%);
  --ocr-grad-chrome: linear-gradient(180deg, #FFFFFF 0%, #E3E4E6 38%, #9FA1A4 64%, #C9CACD 100%);
  --ocr-lueur-rouge: radial-gradient(130% 90% at 80% -10%, rgba(214,32,30,.35), transparent 55%);

  /* ── Typographie ────────────────────────────────────────── */
  --ocr-titre: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ocr-texte: 'Manrope',    system-ui, -apple-system, 'Segoe UI', sans-serif;

  --ocr-t-display: 300 clamp(28px, 6vw, 46px)/1.15 var(--ocr-titre);
  --ocr-t-h1:      300 clamp(24px, 5vw, 34px)/1.2  var(--ocr-titre);
  --ocr-t-h2:      500 clamp(18px, 3vw, 22px)/1.3  var(--ocr-titre);
  --ocr-t-h3:      500 16px/1.35 var(--ocr-titre);
  --ocr-t-corps:   400 15px/1.6  var(--ocr-texte);
  --ocr-t-petit:   400 13px/1.5  var(--ocr-texte);
  --ocr-t-mini:    400 12px/1.45 var(--ocr-texte);   /* plancher absolu */

  --ocr-suivi-titre:  .02em;
  --ocr-suivi-label:  .16em;
  --ocr-suivi-signature: .34em;

  /* ── Espacement ─────────────────────────────────────────── */
  --ocr-e1: 4px;  --ocr-e2: 8px;  --ocr-e3: 12px; --ocr-e4: 16px;
  --ocr-e5: 24px; --ocr-e6: 32px; --ocr-e7: 48px; --ocr-e8: 64px; --ocr-e9: 96px;

  /* ── Rayons — quatre valeurs, pas cinq ──────────────────── */
  --ocr-r-s:  4px;    /* boutons          */
  --ocr-r-m:  8px;    /* toutes les cartes*/
  --ocr-r-l:  16px;   /* grands panneaux  */
  --ocr-r-p:  999px;  /* pilules          */

  /* ── Ombres — une seule, sous le bouton primaire ────────── */
  --ocr-ombre-btn: 0 14px 30px -12px rgba(214,32,30,.55);
  --ocr-ombre-feuille: 0 -30px 60px -20px rgba(0,0,0,.7);

  --ocr-transition: .16s cubic-bezier(.4,0,.2,1);

  /* ── Détails d'interface pilotés par le thème ───────────── */
  --ocr-sep:   rgba(244,244,245,.06);   /* filets internes des cartes     */
  --ocr-trace: rgba(244,244,245,.08);   /* piste des barres de progression*/
  --ocr-jauge: rgba(244,244,245,.28);   /* remplissage neutre d'une barre */
}

/* ─────────────────────────────────────────────────────────────
   BASE
   ───────────────────────────────────────────────────────────── */
.ocr, .ocr *, .ocr *::before, .ocr *::after { box-sizing: border-box; }
.ocr {
  background: var(--ocr-noir);
  color: var(--ocr-blanc);
  font: var(--ocr-t-corps);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Accessibilité : un anneau de focus visible partout. */
.ocr :focus-visible {
  outline: 2px solid var(--ocr-rouge-texte);
  outline-offset: 3px;
  border-radius: inherit;
}

@media (prefers-reduced-motion: reduce) {
  .ocr *, .ocr *::before, .ocr *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}

/* ─────────────────────────────────────────────────────────────
   TYPOGRAPHIE
   ───────────────────────────────────────────────────────────── */
.ocr-display { font: var(--ocr-t-display); letter-spacing: var(--ocr-suivi-titre); text-transform: uppercase; margin: 0; }
.ocr-h1 { font: var(--ocr-t-h1); letter-spacing: var(--ocr-suivi-titre); text-transform: uppercase; margin: 0; }
.ocr-h2 { font: var(--ocr-t-h2); letter-spacing: var(--ocr-suivi-titre); margin: 0; }
.ocr-h3 { font: var(--ocr-t-h3); margin: 0; }
.ocr-corps  { font: var(--ocr-t-corps); color: var(--ocr-argent); }
.ocr-petit  { font: var(--ocr-t-petit); color: var(--ocr-argent); }
.ocr-mini   { font: var(--ocr-t-mini);  color: var(--ocr-argent-2); }
.ocr-chiffre{ font-variant-numeric: tabular-nums; }
.ocr-chrome {
  background: var(--ocr-grad-chrome); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--ocr-blanc); /* repli si non supporté */
}
/* Casse normale pour les noms longs : les capitales sont réservées
   aux titres courts, aux labels et à la signature. */
.ocr-nom { font-family: var(--ocr-texte); font-weight: 600; text-transform: none; letter-spacing: 0; }

/* Sur-titre rouge avec filet — le motif « Eyebrow » de la charte. */
.ocr-surtitre {
  display: inline-flex; align-items: center; gap: var(--ocr-e3);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase;
  color: var(--ocr-rouge-texte);
}
.ocr-surtitre::before { content: ''; width: 22px; height: 1px; background: var(--ocr-rouge); }

.ocr-signature {
  font-family: var(--ocr-titre); font-weight: 300; font-size: 12px;
  letter-spacing: var(--ocr-suivi-signature); text-transform: uppercase; color: var(--ocr-argent-2);
}
.ocr-etincelle { color: var(--ocr-rouge); }

/* ─────────────────────────────────────────────────────────────
   BOUTONS
   ───────────────────────────────────────────────────────────── */
.ocr-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ocr-e2);
  min-height: 48px;                       /* cible tactile Android */
  padding: 13px 22px; border-radius: var(--ocr-r-s); border: 1px solid transparent;
  font-family: var(--ocr-titre); font-weight: 500; font-size: 14px;
  letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
  cursor: pointer; transition: transform var(--ocr-transition), background var(--ocr-transition), filter var(--ocr-transition);
}
.ocr-btn:hover:not(:disabled) { transform: translateY(-2px); }
.ocr-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.ocr-btn--primaire { background: var(--ocr-grad-rouge); color: #fff; box-shadow: var(--ocr-ombre-btn); }
.ocr-btn--primaire:hover:not(:disabled) { filter: brightness(1.08); }
.ocr-btn--secondaire { background: rgba(244,244,245,.05); color: var(--ocr-blanc); border-color: var(--ocr-filet); }
.ocr-btn--secondaire:hover:not(:disabled) { background: rgba(244,244,245,.09); border-color: rgba(214,32,30,.5); }
.ocr-btn--fantome { background: none; color: var(--ocr-argent); }
.ocr-btn--fantome:hover:not(:disabled) { color: var(--ocr-blanc); }
.ocr-btn--wa { background: #25D366; color: #06351B; }
.ocr-btn--wa:hover:not(:disabled) { filter: brightness(1.06); }
.ocr-btn--bloc { width: 100%; }
.ocr-btn--petit { min-height: 40px; padding: 9px 15px; font-size: 12.5px; }

/* ─────────────────────────────────────────────────────────────
   SURFACES
   Fond surélevé + filet : ni l'un ni l'autre ne suffit sur du noir
   en plein soleil ; ensemble, la lisière se lit sans effort.
   ───────────────────────────────────────────────────────────── */
.ocr-carte {
  background: var(--ocr-surface); border: 1px solid var(--ocr-filet);
  border-radius: var(--ocr-r-m); padding: var(--ocr-e5);
  transition: border-color var(--ocr-transition), transform var(--ocr-transition);
}
.ocr-carte--cliquable { cursor: pointer; }
.ocr-carte--cliquable:hover { transform: translateY(-3px); border-color: rgba(214,32,30,.5); }
.ocr-carte--vedette { border-color: rgba(214,32,30,.55); background:
  linear-gradient(180deg, rgba(214,32,30,.07), transparent 45%), var(--ocr-surface); }
.ocr-carte--panneau { border-radius: var(--ocr-r-l); padding: var(--ocr-e6); }
.ocr-carte--lueur { background: var(--ocr-lueur-rouge), var(--ocr-surface); }

.ocr-separateur { height: 1px; background: var(--ocr-filet); border: 0; margin: var(--ocr-e6) 0; }

/* ─────────────────────────────────────────────────────────────
   CHIPS, PASTILLES, BADGES
   ───────────────────────────────────────────────────────────── */
.ocr-chip {
  display: inline-flex; align-items: center; gap: var(--ocr-e2);
  min-height: 40px; padding: 8px 16px; border-radius: var(--ocr-r-p);
  background: var(--ocr-surface); border: 1px solid var(--ocr-filet);
  color: var(--ocr-argent); font: var(--ocr-t-petit); font-weight: 600;
  cursor: pointer; transition: var(--ocr-transition);
}
.ocr-chip:hover { color: var(--ocr-blanc); border-color: rgba(214,32,30,.45); }
.ocr-chip[aria-pressed="true"], .ocr-chip.est-actif {
  background: var(--ocr-rouge); border-color: var(--ocr-rouge); color: #fff;
}

.ocr-pastille {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 4px 10px; border-radius: var(--ocr-r-p);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase;
}
.ocr-pastille--neutre  { background: var(--ocr-surface-haute); color: var(--ocr-argent); }
.ocr-pastille--marque  { background: rgba(214,32,30,.14); color: var(--ocr-rouge-texte); }
.ocr-pastille--succes  { background: rgba(55,194,107,.14); color: var(--ocr-vert); }
.ocr-pastille--alerte  { background: rgba(245,166,35,.14); color: var(--ocr-ambre); }
.ocr-pastille--erreur  { background: rgba(232,82,78,.14); color: var(--ocr-erreur); }
.ocr-badge-vedette {
  position: absolute; top: 12px; left: 12px;
  background: var(--ocr-rouge); color: #fff; padding: 5px 11px; border-radius: var(--ocr-r-p);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase;
}

/* ─────────────────────────────────────────────────────────────
   CHAMPS
   ───────────────────────────────────────────────────────────── */
.ocr-champ { display: block; margin-bottom: var(--ocr-e4); }
.ocr-label {
  display: block; margin-bottom: var(--ocr-e2);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase; color: var(--ocr-argent);
}
.ocr-saisie {
  width: 100%; min-height: 48px; padding: 13px 15px;
  background: var(--ocr-surface-haute); border: 1px solid var(--ocr-filet);
  border-radius: var(--ocr-r-m); color: var(--ocr-blanc);
  font: var(--ocr-t-corps); outline: none; transition: var(--ocr-transition);
}
.ocr-saisie::placeholder { color: var(--ocr-argent-2); }
.ocr-saisie:focus { border-color: var(--ocr-rouge); }
.ocr-saisie:disabled { opacity: .45; cursor: not-allowed; }
.ocr-saisie[aria-invalid="true"] { border-color: var(--ocr-erreur); }
.ocr-aide  { margin-top: 6px; font: var(--ocr-t-mini); color: var(--ocr-argent-2); }
.ocr-erreur-champ { margin-top: 6px; font: var(--ocr-t-mini); color: var(--ocr-erreur);
  display: flex; align-items: center; gap: 6px; }

/* ─────────────────────────────────────────────────────────────
   MESSAGES D'ÉTAT — couleur + icône + libellé, jamais la couleur seule
   ───────────────────────────────────────────────────────────── */
.ocr-message {
  display: flex; gap: var(--ocr-e3); align-items: flex-start;
  padding: var(--ocr-e3) var(--ocr-e4); border-radius: var(--ocr-r-m);
  border: 1px solid var(--ocr-filet); background: var(--ocr-surface);
  font: var(--ocr-t-petit); color: var(--ocr-argent);
}
.ocr-message--succes { border-color: rgba(55,194,107,.42); background: rgba(55,194,107,.07); }
.ocr-message--alerte { border-color: rgba(245,166,35,.42); background: rgba(245,166,35,.07); }
.ocr-message--erreur { border-color: rgba(232,82,78,.45);  background: rgba(232,82,78,.07); }
.ocr-message strong  { color: var(--ocr-blanc); font-family: var(--ocr-titre); font-weight: 500; }

/* ─────────────────────────────────────────────────────────────
   TABLEAUX
   ───────────────────────────────────────────────────────────── */
.ocr-tableau { width: 100%; border-collapse: collapse; font: var(--ocr-t-petit); }
.ocr-tableau th {
  text-align: left; padding: 0 var(--ocr-e3) var(--ocr-e3);
  border-bottom: 1px solid var(--ocr-filet); white-space: nowrap;
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase; color: var(--ocr-argent);
}
.ocr-tableau td { padding: var(--ocr-e3); border-bottom: 1px solid rgba(244,244,245,.06); }
.ocr-tableau tr:last-child td { border-bottom: 0; }
.ocr-tableau .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ocr-tableau-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ocr-tableau-defile > .ocr-tableau { min-width: 680px; }
.ocr-tableau .fort { color: var(--ocr-blanc); font-weight: 600; }

/* ─────────────────────────────────────────────────────────────
   MARQUE
   ───────────────────────────────────────────────────────────── */
.ocr-embleme {
  width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(120% 120% at 50% 0%, #1d1d20, #0a0a0b);
  border: 1px solid rgba(244,244,245,.14);
}
.ocr-embleme img { width: 74%; height: auto; display: block; }
.ocr-marque { display: flex; align-items: center; gap: var(--ocr-e3); }
.ocr-marque-nom {
  font-family: var(--ocr-titre); font-weight: 500; font-size: 15px;
  letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: var(--ocr-blanc);
}
.ocr-marque-baseline {
  font-family: var(--ocr-titre); font-weight: 300; font-size: 12px;
  letter-spacing: .22em; text-transform: uppercase; color: var(--ocr-rouge-texte); margin-top: 3px;
}

/* Lignes de vitesse — motif 2 de la charte */
.ocr-vitesse { display: flex; flex-direction: column; gap: 5px; }
.ocr-vitesse span {
  height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--ocr-rouge));
}
.ocr-vitesse span:nth-child(1) { width: 100%; }
.ocr-vitesse span:nth-child(2) { width: 72%; }
.ocr-vitesse span:nth-child(3) { width: 44%; }

/* ─────────────────────────────────────────────────────────────
   MISE EN PAGE
   ───────────────────────────────────────────────────────────── */
.ocr-contenu { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 var(--ocr-e5); }
.ocr-section { padding: var(--ocr-e9) 0; }
.ocr-grille { display: grid; gap: var(--ocr-e4); }
.ocr-grille--2 { grid-template-columns: repeat(2, 1fr); }
.ocr-grille--3 { grid-template-columns: repeat(3, 1fr); }
.ocr-grille--4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .ocr-grille--3, .ocr-grille--4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .ocr-grille--2, .ocr-grille--3, .ocr-grille--4 { grid-template-columns: 1fr; }
  .ocr-section { padding: var(--ocr-e7) 0; }
  .ocr-contenu { padding: 0 var(--ocr-e4); }
}

/* ─────────────────────────────────────────────────────────────
   MOUVEMENT & RELIEF — partagé par toutes les surfaces
   Discret, rapide, et respecte prefers-reduced-motion.
   ───────────────────────────────────────────────────────────── */
.ocr-btn--primaire {
  background: linear-gradient(180deg, #E5342F, #C21A18);
  box-shadow: 0 6px 18px rgba(214,32,30,.26), inset 0 1px 0 rgba(255,255,255,.14);
}
.ocr-btn--primaire:hover { background: linear-gradient(180deg, #EC4540, #D6201E); }
.ocr-btn:active { transform: scale(.97); }
.ocr-chip[aria-pressed="true"] { box-shadow: 0 4px 14px rgba(214,32,30,.3); }

.voile { animation: ocrVoile .16s ease-out; }
.boite { animation: ocrBoite .22s cubic-bezier(.2,.9,.3,1.15); }
.toast { animation: ocrToast .28s cubic-bezier(.2,.9,.3,1.3); }
@keyframes ocrVoile { from { opacity: 0; } }
@keyframes ocrBoite { from { opacity: 0; transform: scale(.94) translateY(10px); } }
@keyframes ocrToast { from { opacity: 0; transform: translateY(12px); } }

@media (hover: hover) {
  .ocr-carte { transition: border-color .2s ease, transform .2s ease; }
  .fiche:hover, .presta:hover { transform: translateY(-1px); }
}
* { scrollbar-width: thin; scrollbar-color: #2A2A2F transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: #2A2A2F; border-radius: 999px; }

@media (prefers-reduced-motion: reduce) {
  .voile, .boite, .toast { animation: none; }
  .ocr-btn:active { transform: none; }
  .fiche:hover, .presta:hover { transform: none; }
}

/* ─────────────────────────────────────────────────────────────
   MODE CLAIR — appliqué avec la classe .theme-clair sur .ocr.
   Les noms de variables ne changent pas : --ocr-noir reste
   « le fond » et --ocr-blanc « le texte », quel que soit le thème.
   Contrastes vérifiés : texte principal 16,9:1, secondaire 7,3:1,
   rouge texte 5,9:1 sur fond clair.
   ───────────────────────────────────────────────────────────── */
.ocr.theme-clair {
  --ocr-noir:          #F5F5F6;
  --ocr-noir-2:        #ECECEE;
  --ocr-surface:       #FFFFFF;
  --ocr-surface-haute: #EFEFF1;
  --ocr-filet:         #DCDCE0;

  --ocr-blanc:         #141417;
  --ocr-argent:        #505257;
  --ocr-argent-2:      #6E7075;

  --ocr-rouge-texte:   #BB1F1D;
  --ocr-vert:          #157A40;
  --ocr-ambre:         #9C6200;
  --ocr-erreur:        #BB1F1D;

  --ocr-grad-chrome: linear-gradient(180deg, #3E3F43 0%, #6E7075 42%, #2E2F33 68%, #55575C 100%);
  --ocr-lueur-rouge: radial-gradient(130% 90% at 80% -10%, rgba(214,32,30,.12), transparent 55%);
  --ocr-ombre-feuille: 0 -30px 60px -20px rgba(0,0,0,.16);

  --ocr-sep:   rgba(10,10,11,.08);
  --ocr-trace: rgba(10,10,11,.09);
  --ocr-jauge: rgba(10,10,11,.30);
}


/* ---- propre à l'app de réservation ---- */
html,body{margin:0;padding:0;min-height:100dvh}
body{padding-bottom:env(safe-area-inset-bottom)}
.masque{display:none!important}

.entete{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ocr-filet);
  padding:10px calc(var(--ocr-e4) + env(safe-area-inset-right)) 10px calc(var(--ocr-e4) + env(safe-area-inset-left));
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:var(--ocr-e3)}
/* Une plaque se lit caractère par caractère : majuscules, chiffres à largeur
   fixe, un peu d'air entre les signes. */
.ocr-saisie.plaque{text-transform:uppercase;letter-spacing:.1em;
  font-variant-numeric:tabular-nums;font-weight:600}
/* ---- Mon espace : feuille modale + reçu imprimable ---- */
.voile-espace{position:fixed;inset:0;background:rgba(5,5,6,.72);backdrop-filter:blur(4px);z-index:100;
  display:grid;place-items:center;padding:var(--ocr-e4);animation:ocrVoile .16s ease-out}
.boite-espace{width:100%;max-width:430px;max-height:88dvh;overflow:auto}
@media print{
  html,body{background:#fff!important}
  .entete,.sans-impression,#toasts,#bandeau,.voile-espace{display:none!important}
  .corps{padding:0!important;max-width:none!important}
  .recu{border:0!important;background:#fff!important;color:#141417!important;box-shadow:none!important}
  .recu *{color:#141417!important}
  .recu .ocr-mini,.recu .ocr-label{color:#55575c!important}
}

/* Épinglée sur l'écran d'accueil, l'app passe sous l'heure et la batterie
   de l'iPhone : le bandeau du haut doit s'en écarter aussi. En plein écran,
   minimum garanti de 54px même sans mesure d'encoche. */
#bandeau .bandeau:first-child{padding-top:calc(10px + env(safe-area-inset-top))}
.plein-ecran .entete{padding-top:max(calc(10px + env(safe-area-inset-top)), 54px)}
.plein-ecran #bandeau .bandeau:first-child{padding-top:max(calc(10px + env(safe-area-inset-top)), 54px)}
.entete img{height:30px;display:block}
.entete .liens{margin-left:auto;display:flex;gap:6px;flex:none}
.entete .liens .ocr-btn{white-space:nowrap}
/* Sur un téléphone étroit, l'en-tête doit tenir sur une ligne : on resserre
   les boutons et on efface la signature du logo plutôt que de déborder. */
@media(max-width:479px){
  .entete{gap:8px;padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}
  .entete .signature-entete{display:none}
  .entete .liens{gap:4px}
  .entete .liens .ocr-btn{padding:9px 10px;font-size:11.5px;letter-spacing:.03em;min-height:40px}
}

.corps{max-width:680px;margin:0 auto;width:100%;box-sizing:border-box;
  padding:var(--ocr-e5) calc(var(--ocr-e4) + env(safe-area-inset-right)) 60px calc(var(--ocr-e4) + env(safe-area-inset-left))}

.hero{text-align:center;padding:var(--ocr-e6) 0 var(--ocr-e5);position:relative}
.hero::before{content:'';position:absolute;left:50%;top:-20px;transform:translateX(-50%);
  width:min(90vw,520px);height:300px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 35%,rgba(214,32,30,.14),transparent 65%)}
.hero img{width:min(78%,300px);margin:0 auto var(--ocr-e4);display:block;position:relative;
  animation:heroIn .6s ease-out}
@keyframes heroIn{from{opacity:0;transform:translateY(10px)}}
.coche-ok{display:inline-grid;place-items:center;width:74px;height:74px;border-radius:50%;
  background:rgba(55,194,107,.12);border:2px solid rgba(55,194,107,.5);font-size:34px;
  animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.hero img,.coche-ok{animation:none}}
.hero h1{font:300 15px/1.6 var(--ocr-titre);letter-spacing:.22em;text-transform:uppercase;
  color:var(--ocr-argent);margin:0 0 6px}
.hero .ou{font:var(--ocr-t-petit);color:var(--ocr-argent-2)}

.etapes{display:flex;gap:6px;margin-bottom:var(--ocr-e5)}
.etapes span{flex:1;height:4px;border-radius:999px;background:rgba(244,244,245,.1)}
.etapes span.faite{background:var(--ocr-rouge)}

.presta{display:flex;align-items:center;gap:var(--ocr-e3);width:100%;text-align:left;cursor:pointer;
  background:var(--ocr-surface);border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-m);
  padding:13px 15px;margin-bottom:8px;transition:var(--ocr-transition)}
.presta:hover{border-color:rgba(214,32,30,.45)}
.presta[aria-pressed="true"]{border-color:var(--ocr-rouge);background:rgba(214,32,30,.09)}
.presta .nm{font:600 14.5px/1.25 var(--ocr-texte);color:var(--ocr-blanc)}
.presta .du{font:var(--ocr-t-mini);color:var(--ocr-argent-2);margin-top:3px}
.presta .pr{margin-left:auto;font:700 15px/1 var(--ocr-texte);font-variant-numeric:tabular-nums;white-space:nowrap}
.presta .coche{width:20px;height:20px;border-radius:6px;border:2px solid var(--ocr-filet);flex:none;
  display:grid;place-items:center;font-size:11px;color:#fff}
.presta[aria-pressed="true"] .coche{background:var(--ocr-rouge);border-color:var(--ocr-rouge)}

.jours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.jour{flex:none;width:64px;padding:10px 0;text-align:center;cursor:pointer;
  background:var(--ocr-surface);border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-m);
  color:var(--ocr-argent);transition:var(--ocr-transition)}
.jour[aria-pressed="true"]{border-color:var(--ocr-rouge);background:rgba(214,32,30,.09);color:var(--ocr-blanc)}
.jour .js{font:600 11px/1 var(--ocr-titre);letter-spacing:.08em;text-transform:uppercase;display:block}
.jour .jn{font:700 19px/1.1 var(--ocr-texte);display:block;margin-top:4px}
.jour .jm{font:var(--ocr-t-mini);display:block;margin-top:2px}

/* cartes lavage : sélection + détail dépliable */
.lav{background:var(--ocr-surface);border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-m);
  margin-bottom:8px;overflow:hidden;transition:var(--ocr-transition)}
.lav--on{border-color:var(--ocr-rouge);background:rgba(214,32,30,.07)}
.lav-tete{display:flex;gap:var(--ocr-e3);align-items:center;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;padding:13px 15px;color:var(--ocr-blanc)}
.lav-detail{all:unset;cursor:pointer;display:block;padding:0 15px 12px;
  font:var(--ocr-t-mini);color:var(--ocr-rouge-texte);letter-spacing:.04em}
.lav-liste{list-style:none;margin:0 15px;padding:10px 0 13px;border-top:1px solid rgba(244,244,245,.07)}
.lav-liste li{font:var(--ocr-t-petit);color:var(--ocr-argent);padding:3.5px 0;display:flex;gap:9px}
.lav-liste li::before{content:'✓';color:var(--ocr-succes);flex:none}

/* mes véhicules (enregistrés sur le téléphone) */
.veh{display:flex;gap:var(--ocr-e3);align-items:center;width:100%;text-align:left;cursor:pointer;
  background:var(--ocr-surface);border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-m);
  padding:12px 14px;margin-bottom:8px;color:var(--ocr-blanc);transition:var(--ocr-transition)}
.veh[aria-pressed="true"]{border-color:var(--ocr-rouge);background:rgba(214,32,30,.08)}
.veh .vx{all:unset;cursor:pointer;padding:6px 8px;color:var(--ocr-argent-2);font-size:13px}

.etape-num{width:26px;height:26px;border-radius:50%;background:rgba(214,32,30,.14);
  border:1px solid rgba(214,32,30,.4);color:var(--ocr-rouge-texte);display:grid;place-items:center;
  font:700 13px/1 var(--ocr-texte);flex:none}

.heures{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:var(--ocr-e4)}
.heure{padding:11px 0;text-align:center;cursor:pointer;font:600 14px/1 var(--ocr-texte);
  background:var(--ocr-surface);border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-m);
  color:var(--ocr-blanc);font-variant-numeric:tabular-nums;transition:var(--ocr-transition)}
.heure[aria-pressed="true"]{border-color:var(--ocr-rouge);background:var(--ocr-rouge)}

.total-collant{position:sticky;bottom:0;margin:var(--ocr-e5) calc(-1*var(--ocr-e4)) 0;
  background:rgba(16,16,18,.96);backdrop-filter:blur(14px);border-top:1px solid var(--ocr-filet);
  padding:14px var(--ocr-e4) calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:var(--ocr-e3)}

.ref-bloc{font:700 26px/1.2 var(--ocr-texte);letter-spacing:.06em;font-variant-numeric:tabular-nums;
  color:var(--ocr-blanc);background:var(--ocr-surface-haute);border:1px dashed rgba(214,32,30,.5);
  border-radius:var(--ocr-r-m);padding:16px;text-align:center;margin:var(--ocr-e4) 0}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ocr-surface-haute);border:1px solid var(--ocr-filet);border-radius:999px;
  padding:10px 18px;font:600 13px/1.3 var(--ocr-texte);box-shadow:0 10px 34px rgba(0,0,0,.5);max-width:88vw}
.toast--err{border-color:rgba(232,82,78,.5);color:var(--ocr-erreur)}
.tourne{width:16px;height:16px;border:2px solid var(--ocr-filet);border-top-color:var(--ocr-rouge);
  border-radius:50%;display:inline-block;animation:tr .7s linear infinite}
@keyframes tr{to{transform:rotate(360deg)}}
.vide{text-align:center;padding:36px 18px;color:var(--ocr-argent-2);font:var(--ocr-t-petit)}
.bandeau--demo{padding:10px 16px;font:var(--ocr-t-petit);background:rgba(245,166,35,.12);
  border-bottom:1px solid rgba(245,166,35,.4);color:var(--ocr-ambre)}

const carnet = id => CARNETS.find(c => c.id === id) || null;

/** Prix du carnet pour un gabarit. null = non proposé. */
function prixCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId);
  if (!c || !gabaritId) return null;
  const v = c.prix[gabaritId];
  return v == null ? null : v;
}
/** Les mêmes lavages payés à l'unité. */
function prixCarnetUnite(carnetId, gabaritId) {
  const c = carnet(carnetId);
  const p = prix(CARNET_CONFIG.prestation, gabaritId);
  return (!c || p == null) ? null : p * c.lavages;
}
/** Économie en FCFA et en %. */
function economieCarnet(carnetId, gabaritId) {
  const u = prixCarnetUnite(carnetId, gabaritId), c = prixCarnet(carnetId, gabaritId);
  if (u == null || c == null) return null;
  return { montant: u - c, pct: Math.round((1 - c / u) * 100), parLavage: Math.round(c / carnet(carnetId).lavages) };
}
/** Recette mensuelle reconnue par carnet actif (prix étalé sur sa validité). */
function recetteMensuelleCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId), p = prixCarnet(carnetId, gabaritId);
  return p == null ? null : p / c.validiteMois;
}
/** Heures-baie consommées par mois par un porteur de carnet. */
function heuresCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId);
  const d = duree(CARNET_CONFIG.prestation, gabaritId);
  return d == null ? null : (c.lavages / c.validiteMois) * (d + CONFIG.battementMin) / 60;
}
/** Combien de porteurs actifs pour couvrir un montant de charges fixes. */
function porteursPourCouvrir(chargesFixes, carnetId, gabaritId) {
  const r = recetteMensuelleCarnet(carnetId, gabaritId);
  return r ? Math.ceil(chargesFixes / r) : null;
}

/* ─────────────────────────────────────────────────────────────
   6 · OUTILS
   ───────────────────────────────────────────────────────────── */
const gabarit    = id => GABARITS.find(g => g.id === id) || null;
const prestation = id => PRESTATIONS.find(p => p.id === id) || null;
const option     = id => OPTIONS.find(o => o.id === id) || null;
const service    = id => SERVICES.find(s => s.id === id) || null;

/** Montant en FCFA, format « 12 500 F ». */
function fcfa(n) {
  if (n == null) return 'Sur devis';
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F';
}

/** Prix exact d'une prestation pour un gabarit. null = sur devis. */
function prix(prestationId, gabaritId) {
  const p = prestation(prestationId);
  if (!p || !gabaritId) return null;
  const v = p.prix[gabaritId];
  return v == null ? null : v;
}
const prixTexte = (pid, gid) => fcfa(prix(pid, gid));

/** Prix d'appel « dès X » — le plus bas publié. null si tout est sur devis. */
function prixDes(prestationId) {
  const p = prestation(prestationId);
  if (!p) return null;
  const vals = Object.values(p.prix).filter(v => v != null);
  return vals.length ? Math.min.apply(null, vals) : null;
}

/** Durée en minutes pour un gabarit. */
function duree(prestationId, gabaritId) {
  const p = prestation(prestationId);
  if (!p) return null;
  const v = p.durees[gabaritId];
  return v == null ? null : v;
}

/** « 1 h 30 », « 45 min ». */
function dureeTexte(min) {
  if (min == null) return '';
  if (min >= 1440) return Math.round(min / 1440) + ' j';
  if (min >= 60) { const h = Math.floor(min / 60), m = min % 60; return m ? h + ' h ' + m : h + ' h'; }
  return min + ' min';
}

/** Fourchette de durée affichée avant le choix du gabarit. */
function dureeFourchette(prestationId) {
  const p = prestation(prestationId);
  if (!p) return '';
  if (p.dureeEstimee) return p.dureeEstimee;
  const d = Object.values(p.durees).filter(v => v != null);
  if (!d.length) return '';
  const lo = Math.min.apply(null, d), hi = Math.max.apply(null, d);
  return lo === hi ? dureeTexte(lo) : dureeTexte(lo) + '–' + dureeTexte(hi);
}

const min2hm = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const hm2min = s => { const a = s.split(':').map(Number); return a[0] * 60 + a[1]; };

/**
 * Heures de DÉBUT possibles : le lavage doit être TERMINÉ à la fermeture.
 * Le battement est appliqué à l'occupation de la baie, pas au dernier créneau
 * (le rangement peut déborder après 21 h).
 */
function creneaux(prestationId, gabaritId) {
  const d = duree(prestationId, gabaritId);
  if (d == null) return [];
  const out = [];
  for (let m = CONFIG.ouvertureMin; m + d <= CONFIG.fermetureMin; m += CONFIG.pasCreneau) out.push(min2hm(m));
  return out;
}

/** Occupation réelle d'une baie : fin du lavage + battement. */
function occupation(debutHm, prestationId, gabaritId) {
  const d = duree(prestationId, gabaritId);
  if (d == null) return null;
  const debut = hm2min(debutHm);
  return { debut: debutHm, fin: min2hm(debut + d), baieLibre: min2hm(debut + d + CONFIG.battementMin) };
}

/** Options proposables : ni déjà comprises, ni réservées à une autre prestation. */
function optionsPour(prestationId) {
  const p = prestation(prestationId);
  if (!p) return [];
  return OPTIONS
    .filter(o => !o.reservee || o.reservee.indexOf(prestationId) !== -1)
    .map(o => ({ ...o, comprise: p.inclus.indexOf(o.id) !== -1 }));
}

/** Total d'une commande. devis>0 ⇒ un montant manuel est requis. */
function total(prestationId, gabaritId, optionIds, avecValet, montantManuel) {
  const p = prestation(prestationId);
  const base = prix(prestationId, gabaritId);
  let sousTotal = base == null ? 0 : base;
  let devis = base == null ? 1 : 0;

  (optionIds || []).forEach(id => {
    const o = option(id);
    if (!o) return;
    if (p && p.inclus.indexOf(id) !== -1) return;      // déjà comprise : jamais refacturée
    sousTotal += o.prix;
  });

  if (avecValet) sousTotal += service('valet').prix;
  sousTotal += Math.max(0, Number(montantManuel) || 0);

  return { total: sousTotal, devis: devis, base: base };
}

/** Acompte : 20 % arrondi, ou 100 % si Pickup & Retour. */
function acompte(montantTotal, avecValet) {
  if (montantTotal == null || montantTotal <= 0) return 0;
  if (avecValet) return montantTotal;
  const a = montantTotal * CONFIG.acomptePct;
  return Math.round(a / CONFIG.acompteArrondi) * CONFIG.acompteArrondi;
}

/**
 * Référence unique — OCR-2608-0042.
 * Année/mois + numéro séquentiel du mois, fourni par la base de données.
 * Lisible, triable, dictable au téléphone. C'est ELLE qui relie la
 * réservation, le paiement KKiapay, le véhicule à l'atelier et la clôture.
 */
function reference(annee, mois, sequence) {
  const aa = String(annee).slice(-2);
  const mm = String(mois).padStart(2, '0');
  const nn = String(sequence).padStart(4, '0');
  return 'OCR-' + aa + mm + '-' + nn;
}
function lireReference(ref) {
  const m = /^OCR-(\d{2})(\d{2})-(\d{4})$/.exec(String(ref || '').trim().toUpperCase());
  return m ? { annee: 2000 + +m[1], mois: +m[2], sequence: +m[3] } : null;
}

/* ─────────────────────────────────────────────────────────────
   IMMATRICULATION (Bénin)
   Voiture : 2 lettres + 4 chiffres              — CB5916
   Moto    : 1 chiffre + 2 lettres + 4 chiffres  — 2FB9408

   Le champ n'est JAMAIS obligatoire : on peut compléter à l'atelier,
   véhicule devant nous. Mais dès qu'une plaque est saisie, elle est
   ramenée à sa forme canonique (majuscules, sans espace ni tiret) :
   c'est ce qui permet de rattacher tout seul un véhicule à son client
   au passage suivant. « cb 5916 », « CB-5916 » et « CB5916 » doivent
   désigner le MÊME véhicule, sinon on crée des doublons et la fidélité
   se disperse.

   Les formats sont VÉRIFIÉS mais pas IMPOSÉS : une plaque étrangère,
   diplomatique ou ancienne reste acceptée, simplement signalée. Refuser
   un vrai véhicule coûterait plus cher qu'une saisie inhabituelle.
   ───────────────────────────────────────────────────────────── */
const PLAQUE_VOITURE = /^[A-Z]{2}[0-9]{4}$/;
const PLAQUE_MOTO    = /^[0-9][A-Z]{2}[0-9]{4}$/;
const PLAQUE_EXEMPLES = { voiture: 'CB5916', moto: '2FB9408' };

/** Forme canonique d'une plaque : majuscules, sans espace ni ponctuation. */
function plaque(v) {
  return String(v == null ? '' : v).toUpperCase().replace(/[^A-Z0-9]/g, '');
}

/**
 * État d'une plaque saisie : forme propre, type reconnu, format connu ou non.
 * `gabarit` est facultatif — s'il est fourni, on signale une plaque moto sur
 * un gabarit voiture (et l'inverse), qui est presque toujours une erreur.
 */
function plaqueEtat(v, gabarit) {
  const cle = plaque(v);
  if (!cle) return { cle: '', vide: true, type: null, ok: true, accord: true, aide: '' };
  const type = PLAQUE_VOITURE.test(cle) ? 'voiture' : PLAQUE_MOTO.test(cle) ? 'moto' : null;
  if (!type) return { cle, vide: false, type: null, ok: false, accord: true,
    aide: 'Format inhabituel — voiture : ' + PLAQUE_EXEMPLES.voiture + ' · moto : ' + PLAQUE_EXEMPLES.moto };
  // Cohérence avec le gabarit choisi, quand on le connaît.
  const accord = gabarit ? (gabarit === 'moto' ? type === 'moto' : type === 'voiture') : true;
  return { cle, vide: false, type, ok: true, accord,
    aide: accord ? (type === 'moto' ? '✓ Plaque moto' : '✓ Plaque voiture')
                 : (type === 'moto' ? 'Plaque au format moto — vérifie le type de véhicule'
                                    : 'Plaque au format voiture — vérifie le type de véhicule') };
}

/** Lien WhatsApp pré-rempli. */
function lienWhatsApp(message) {
  return 'https://wa.me/' + MARQUE.whatsapp + (message ? '?text=' + encodeURIComponent(message) : '');
}

      if (bloque(k)) return [{ ok: false, jeton: null, nom: null, message: 'Trop d’essais. Attends 15 minutes, ou passe à l’atelier.' }];

      return [{ reference: r.reference, statut: 'annulee' }];

    rpc(nom, args) {
      try { return Promise.resolve({ data: RPC[nom](args || {}), error: null }); }
      catch (ex) { return Promise.resolve({ data: null, error: { message: ex.message } }); }
    },
  };
}

function toast(msg, erreur) {
  const t = document.createElement('div');
  t.className = 'toast' + (erreur ? ' toast--err' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 4200);
}

const lienWA = m => 'https://wa.me/' + OCR.MARQUE.whatsapp + (m ? '?text=' + encodeURIComponent(m) : '');

/* Branche un champ d'immatriculation : mise en forme pendant la frappe
   (majuscules, sans espace ni tiret), curseur conservé. Une plaque toujours
   écrite de la même façon, c'est ce qui permet de retrouver le véhicule et
   son propriétaire d'une fois sur l'autre — sinon on crée des doublons. */
function brancherPlaque(el, apres) {
  if (!el) return;
  el.classList.add('plaque');
  el.setAttribute('autocapitalize', 'characters');
  el.setAttribute('autocomplete', 'off');
  el.setAttribute('spellcheck', 'false');
  el.setAttribute('maxlength', '10');
  el.addEventListener('input', () => {
    const utilesAvant = OCR.plaque(el.value.slice(0, el.selectionStart || 0)).length;
    const propre = OCR.plaque(el.value);
    if (el.value !== propre) { el.value = propre; el.setSelectionRange(utilesAvant, utilesAvant); }
    if (apres) apres(propre);
  });
}
/* L'aide sous le champ : le format attendu, ou la plaque reconnue. Jamais bloquant. */
function aidePlaque(v, gabarit) {
  const et = OCR.plaqueEtat(v, gabarit);
  if (et.vide) return 'Voiture : ' + OCR.PLAQUE_EXEMPLES.voiture + ' · Moto : ' + OCR.PLAQUE_EXEMPLES.moto;
  if (!et.ok || !et.accord) return '<span style="color:var(--ocr-ambre)">' + esc(et.aide) + '</span>';
  return '<span style="color:var(--ocr-vert)">' + esc(et.aide) + '</span>';
}

/* ---------- disponibilité : 2 baies + battement, refus si doute ---------- */
async function creneauxDispo(date, prestationId, gabaritId) {
  const duree = OCR.duree(prestationId, gabaritId);
  if (duree == null) return [];
  // La capacité réelle = les baies actives en ce moment (travaux, pannes…).
  const [occRep, baiesRep] = await Promise.all([
    sb.rpc('ocr_creneaux_occupes', { p_date: date }),
    sb.rpc('ocr_baies_actives'),
  ]);
  if (occRep.error || baiesRep.error) throw new Error('Disponibilités injoignables');
  const nbBaies = (baiesRep.data || []).length;
  if (!nbBaies) return [];
  const buf = OCR.CONFIG.battementMin;
  const occ = (occRep.data || []).map(r => { const a = OCR.hm2min(heureCourte(r.heure)); return [a, a + (r.duree_min || 60) + buf]; });
  const mnt = new Date();
  const minMin = date === auj() ? mnt.getHours() * 60 + mnt.getMinutes() + 30 : 0;
  return OCR.creneaux(prestationId, gabaritId).filter(hm => {
    const a = OCR.hm2min(hm), b = a + duree + buf;
    if (a < minMin) return false;
    for (let t = a; t < b; t += 5)
      if (occ.filter(([x, y]) => t >= x && t < y).length >= nbBaies) return false;
    return true;
  });
}

/* ---------- rendu ---------- */
function rendre() {
  if (vue === 'accueil')  return vueAccueil();
  if (vue === 'reserver') return vueReserver();
  if (vue === 'suivi')    return vueSuivi();
  if (vue === 'espace')   return vueEspace();
  if (vue === 'recu')     return vueRecu();
}
/* true pendant qu'on dépile NOUS-MÊMES une entrée d'historique qu'on vient de
   « fermer » par une action explicite (logo, bouton Fermer/Enregistrer…) :
   le popstate qui en résulte ne doit rien refaire, sinon il rejoue aussi la
   logique du vrai geste retour au mauvais moment (bug vu le 12/08). */
let retourInterne = false;

/* La navigation écoute au niveau du document : les boutons [data-nav] peints
   dans les vues (« suivre une réservation sans espace ») marchent aussi. */
document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-nav]');
  if (!b) return;
  const dest = b.dataset.nav;
  // Geste retour (Android) : quitter l'accueil empile UN cran d'historique.
  // Y revenir explicitement (logo) dépile proprement au lieu d'en laisser traîner.
  if (dest === 'accueil' && vue !== 'accueil' && history.state && history.state.ocrVue) { retourInterne = true; history.back(); }
  else if (dest !== 'accueil' && vue === 'accueil') history.pushState({ ocrVue: true }, '');
  vue = dest;
  if (vue === 'reserver' && confirmation) { confirmation = null; etape = 1; }
  rendre();
  window.scrollTo(0, 0);
});
/* Le bouton/geste retour ferme d'abord une fenêtre ouverte ; sinon il ramène
   à l'accueil plutôt que de fermer l'app installée — jamais de sortie surprise. */
window.addEventListener('popstate', () => {
  if (retourInterne) { retourInterne = false; return; }   // c'était nous, pas un vrai geste retour
  const f = document.querySelector('.voile-espace:last-child');
  if (f) { f.remove(); return; }
  if (vue !== 'accueil') { vue = 'accueil'; rendre(); window.scrollTo(0, 0); }
});

/* ==========================================================================
   RÉSERVER — 3 étapes + confirmation
   ========================================================================== */
function vueReserver() {
  if (confirmation) return vueConfirmation();
  if (etape === 1) return vueEtapePrestation();
  if (etape === 2) return vueEtapeCreneau();
  if (etape === 3) return vueEtapeCoordonnees();
}

const barreEtapes = () => `<div class="etapes">${[1, 2, 3].map(n =>
  `<span class="${n <= etape ? 'faite' : ''}"></span>`).join('')}</div>`;

/* Carte lavage : résumé toujours visible, contenu complet dépliable. */
function carteLavage(p, selectionnable) {
  const prix = OCR.prix(p.id, resa.gabarit);
  const ouvert = detailOuvert === p.id;
  const choisie = selectionnable && resa.prestation === p.id;
  return `<div class="lav ${choisie ? 'lav--on' : ''}">
    <${selectionnable ? `button class="lav-tete" data-presta="${p.id}"` : 'div class="lav-tete" style="cursor:default"'}>
      ${selectionnable ? `<span class="coche" style="width:20px;height:20px;border-radius:6px;border:2px solid ${choisie ? 'var(--ocr-rouge)' : 'var(--ocr-filet)'};
        background:${choisie ? 'var(--ocr-rouge)' : 'transparent'};display:grid;place-items:center;font-size:11px;color:#fff;flex:none">${choisie ? '✓' : ''}</span>` : ''}
      <span style="min-width:0">
        <span style="font:600 14.5px/1.25 var(--ocr-texte);display:block">${esc(p.nom)}${p.populaire ? ' <span class="ocr-pastille ocr-pastille--marque" style="font-size:9px;vertical-align:2px">Populaire</span>' : ''}</span>
        <span style="font:var(--ocr-t-mini);color:var(--ocr-argent-2);display:block;margin-top:3px">${esc(p.resume || p.mention || '')}</span>
      </span>
      <span style="margin-left:auto;text-align:right;flex:none">
        <span style="font:700 15px/1 var(--ocr-texte);display:block">${prix == null ? 'Sur devis' : OCR.fcfa(prix)}</span>
        ${OCR.duree(p.id, resa.gabarit) ? `<span class="ocr-mini">${OCR.dureeTexte(OCR.duree(p.id, resa.gabarit))}</span>` : ''}
      </span>
    </${selectionnable ? 'button' : 'div'}>
    <button class="lav-detail" data-detail="${p.id}">${ouvert ? 'Masquer le détail ▲' : 'Ce qui est fait, en détail ▼'}</button>
    ${ouvert ? `<ul class="lav-liste">${(p.contenu || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      ${p.mention ? `<p class="ocr-mini" style="margin:0 15px 13px;color:var(--ocr-ambre)">${esc(p.mention)}</p>` : ''}` : ''}
  </div>`;
}

function brancherDetails(revue) {
  $('#vue').querySelectorAll('[data-detail]').forEach(b => b.addEventListener('click', () => {
    detailOuvert = detailOuvert === b.dataset.detail ? null : b.dataset.detail;
    revue();
  }));
}

function vueEtapePrestation() {
  // premier passage : si des véhicules sont enregistrés, le premier est proposé
  if (garage.length && !resa.vehChoisi) choisirVehicule(garage[0]);

  const opts = resa.prestation ? OCR.optionsPour(resa.prestation).filter(o => !o.comprise) : [];

async function vueEtapeCreneau() {
  const jours = Array.from({ length: 10 }, (_, i) => decaleJour(auj(), i));
  const fmt = d => {
    const x = new Date(d + 'T12:00');
    return { js: x.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', ''),
             jn: x.getDate(), jm: x.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '') };
  };

  $('#vue').innerHTML = `
    ${barreEtapes()}
    <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" id="btnRetour" style="margin-bottom:var(--ocr-e4)">‹ Le lavage</button>
    <div class="ocr-surtitre">2 · Le jour</div>
    <div class="jours" style="margin-top:var(--ocr-e4)">
      ${jours.map(d => { const f = fmt(d); return `
        <button class="jour" data-jour="${d}" aria-pressed="${resa.date === d}">
          <span class="js">${f.js}</span><span class="jn">${f.jn}</span><span class="jm">${f.jm}</span>
        </button>`; }).join('')}
    </div>
    <div class="ocr-surtitre" style="margin-top:var(--ocr-e5)">L’heure</div>
    <div id="zoneHeures"><div class="vide"><span class="tourne"></span></div></div>
    <div class="total-collant">
      <div>
        <div class="ocr-mini">${resa.heure ? jourLong(resa.date) : 'Choisis un horaire'}</div>
        <div style="font:700 20px/1 var(--ocr-texte)">${resa.heure || '—'}</div>
      </div>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" id="btnSuite" ${resa.heure ? '' : 'disabled'}>Mes coordonnées ›</button>
    </div>`;

  $('#btnRetour').addEventListener('click', () => { etape = 1; rendre(); });
  $('#vue').querySelectorAll('[data-jour]').forEach(b => b.addEventListener('click', () => {
    resa.date = b.dataset.jour; resa.heure = null; vueEtapeCreneau();
  }));
  $('#btnSuite').addEventListener('click', () => { etape = 3; rendre(); window.scrollTo(0, 0); });

  // disponibilité — si on ne peut pas vérifier, on ne vend rien
  try {
    const libres = await creneauxDispo(resa.date, resa.prestation, resa.gabarit);
    if (resa.heure && !libres.includes(resa.heure)) resa.heure = null;
    $('#zoneHeures').innerHTML = libres.length
      ? `<div class="heures">${libres.map(h =>
          `<button class="heure" data-heure="${h}" aria-pressed="${resa.heure === h}">${h}</button>`).join('')}</div>`
      : `<div class="vide">Plus de créneau libre ce jour-là.<br>Essaie un autre jour, ou
          <a href="${lienWA('Bonjour, je cherche un créneau pour un lavage.')}" target="_blank" rel="noopener"
             style="color:var(--ocr-rouge-texte)">écris-nous sur WhatsApp</a>.</div>`;
    $('#zoneHeures').querySelectorAll('[data-heure]').forEach(b => b.addEventListener('click', () => {
      resa.heure = b.dataset.heure; vueEtapeCreneau();
    }));
  } catch (ex) {
    $('#zoneHeures').innerHTML = `<div class="ocr-message ocr-message--alerte"><span>⚠</span><div>
      <strong>Impossible de vérifier les disponibilités.</strong><br>
      Vérifie ta connexion et réessaie, ou réserve par
      <a href="${lienWA('Bonjour, je voudrais réserver un lavage.')}" target="_blank" rel="noopener"
         style="color:var(--ocr-rouge-texte)">WhatsApp</a>.</div></div>`;
  }
}

async function reserver() {
  if (enCours) return;
  if (!resa.nom.trim()) return toast('Ton nom est obligatoire.', true);
  if (!resa.tel.trim()) return toast('Ton téléphone est obligatoire.', true);
  const T = OCR.total(resa.prestation, resa.gabarit, resa.options, false);
  enCours = true;
  const b = $('#btnConfirmer'); b.disabled = true; b.textContent = 'Réservation…';
  try {
    // dernière vérification du créneau, juste avant d'écrire
    const libres = await creneauxDispo(resa.date, resa.prestation, resa.gabarit);
    if (!libres.includes(resa.heure)) {
      etape = 2; resa.heure = null; rendre();
      throw new Error('Ce créneau vient d’être pris — choisis-en un autre.');
    }
    const aRegler = resa.paiement === 'tout' ? T.total : OCR.acompte(T.total, false);
    const { data, error } = await sb.rpc('ocr_creer_reservation', {
      p_nom: resa.nom.trim(), p_telephone: resa.tel.trim(),
      p_prestation: resa.prestation, p_gabarit: resa.gabarit, p_options: resa.options,
      p_date: resa.date, p_heure: resa.heure,
      p_duree_min: OCR.duree(resa.prestation, resa.gabarit),
      p_montant: T.total, p_acompte: aRegler,
      p_marque: resa.marque.trim() || null, p_modele: resa.modele.trim() || null,
      p_immat: OCR.plaque(resa.immat) || null,
      p_note: resa.note.trim() || null, p_canal: 'app',
    });
    if (error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    // véhicule mémorisé sur ce téléphone, si demandé et pas déjà connu
    let vehiculeGarde = false;
    const estNouveau = resa.vehChoisi === 'nouveau' || resa.vehChoisi == null;
    if (resa.vehSauver && estNouveau && (resa.marque || resa.modele || resa.immat)) {
      // Comparaison sur la forme canonique de la plaque : « cb 5916 » et
      // « CB5916 » sont le même véhicule, pas deux entrées du garage.
      const plaqueSaisie = OCR.plaque(resa.immat);
      const doublon = garage.some(v => (OCR.plaque(v.immat) && plaqueSaisie && OCR.plaque(v.immat) === plaqueSaisie) ||
        (v.marque === resa.marque && v.modele === resa.modele && v.gabarit === resa.gabarit));
      if (!doublon) {
        garage.push({ id: 'v' + Math.random().toString(36).slice(2, 9), gabarit: resa.gabarit,
                      marque: resa.marque.trim(), modele: resa.modele.trim(), immat: plaqueSaisie });
        sauverGarage();
        vehiculeGarde = true;
      }
    }
    retenirResa(r.reference, resa.tel.trim());   // retrouvable sans rien retaper, sur ce téléphone
    confirmation = { reference: r.reference, date: resa.date, heure: resa.heure,
                     prestation: resa.prestation, gabarit: resa.gabarit, vehiculeGarde,
                     total: T.total, acompte: aRegler, tout: resa.paiement === 'tout', tel: resa.tel.trim() };
    rendre(); window.scrollTo(0, 0);
  } catch (ex) {
    toast(ex.message || 'Réservation impossible', true);
  } finally {
    enCours = false;
    const bb = $('#btnConfirmer'); if (bb) { bb.disabled = false; bb.textContent = 'Réserver'; }
  }
}

      <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" id="btnChercher" ${suivi.cherche ? 'disabled' : ''}>
        ${suivi.cherche ? 'Recherche…' : 'Retrouver ma réservation'}</button>
    </div>
    <div id="zoneFiche" style="margin-top:var(--ocr-e4)">
      ${f === null ? '' : !f ? '<div class="vide">Aucune réservation trouvée avec cette référence et ce numéro.</div>' : ficheResa(f)}
    </div>`;

  ['sRef:ref', 'sTel:tel'].forEach(pr => {
    const [id, k] = pr.split(':');
    $('#' + id).addEventListener('input', e => { suivi[k] = e.target.value; });
  });
  $('#btnChercher').addEventListener('click', chercherResa);
  $('#vue').querySelectorAll('[data-ouvrir]').forEach(b => b.addEventListener('click', () => {
    const r = carnet.find(x => x.ref === b.dataset.ouvrir);
    if (!r) return;
    suivi.ref = r.ref; suivi.tel = r.tel;
    chercherResa();
  }));
  $('#vue').querySelectorAll('[data-oublier]').forEach(b => b.addEventListener('click', () => {
    oublierResa(b.dataset.oublier);
    if (suivi.ref === b.dataset.oublier) { suivi.fiche = null; suivi.ref = ''; suivi.tel = ''; }
    vueSuivi();
  }));
  brancherFiche();
}

function ficheResa(f) {
  const [lab, ton] = ETAT_RESA[f.statut] || [f.statut, 'neutre'];
  const p = OCR.prestation(f.prestation);
  const annulable = ['en_attente_paiement', 'confirmee'].includes(f.statut) && f.date_prevue > auj();
  const total = f.montant_total || 0;
  const avance = f.acompte_attendu || 0;
  const reste = Math.max(0, total - avance);
  const toutRegle = f.statut === 'confirmee' && total > 0 && reste === 0;
  return `<div class="ocr-carte">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <strong style="font:700 17px/1.2 var(--ocr-texte)">${esc(f.reference)}</strong>
      <span class="ocr-pastille ocr-pastille--${ton}">${lab}</span>
      ${toutRegle ? '<span class="ocr-pastille ocr-pastille--succes">Tout est réglé</span>' : ''}
    </div>
    ${[[p ? p.nom : f.prestation, (OCR.gabarit(f.gabarit) || {}).nom || ''],
       [jourLong(f.date_prevue) + ' à ' + heureCourte(f.heure_prevue), ''],
       ['Total', total ? OCR.fcfa(total) : 'Sur devis'],
       [avance >= total && total > 0 ? 'Réglé à la réservation' : 'Avance à la réservation', OCR.fcfa(avance)],
       ...(f.statut === 'confirmee' && reste > 0 ? [['Reste à payer', OCR.fcfa(reste)]] : []),
      ].map(([k, v]) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(244,244,245,.06)">
        <span class="ocr-petit">${esc(k)}</span><span style="font-weight:600">${esc(v)}</span></div>`).join('')}
    ${toutRegle ? `<p class="ocr-petit" style="margin:12px 0 0;color:var(--ocr-succes)">
        ✓ Plus rien à payer — la personne qui dépose le véhicule n’a rien à avancer.</p>` : ''}
    ${f.statut === 'confirmee' && reste > 0 ? `
      <a class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" style="margin-top:12px" target="_blank" rel="noopener"
         href="${lienWA('Bonjour, je voudrais solder le reste de ma réservation ' + f.reference + ', soit ' + OCR.fcfa(reste) + ', par Mobile Money — sans passer par la caisse sur place.')}">
        Solder les ${OCR.fcfa(reste)} à distance</a>
      <p class="ocr-mini" style="margin:8px 0 0;text-align:center">Pratique si quelqu’un d’autre dépose le véhicule.
        Bientôt payable directement ici, dans l’app.</p>` : ''}
    ${annulable ? `
      <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" style="margin-top:12px;color:var(--ocr-argent-2)" data-annuler>
        Annuler cette réservation</button>
      <p class="ocr-mini" style="margin:8px 0 0;text-align:center">Gratuit jusqu’à la veille.
        ${f.statut === 'confirmee' ? 'L’acompte déjà payé te sera remboursé.' : ''}</p>`
    : f.date_prevue <= auj() && ['en_attente_paiement', 'confirmee'].includes(f.statut)
      ? `<p class="ocr-mini" style="margin:12px 0 0">C’est aujourd’hui ! Pour un imprévu,
          <a href="${lienWA('Bonjour, au sujet de ma réservation ' + f.reference + '…')}" target="_blank" rel="noopener"
             style="color:var(--ocr-rouge-texte)">écris-nous sur WhatsApp</a>.</p>` : ''}
  </div>`;
}

async function chercherResa() {
  if (!suivi.ref.trim() || !suivi.tel.trim()) return toast('Référence et téléphone sont nécessaires.', true);
  suivi.cherche = true; vueSuivi();
  try {
    const { data, error } = await sb.rpc('ocr_reservation_par_reference',
      { p_reference: suivi.ref.trim(), p_telephone: suivi.tel.trim() });
    if (error) throw error;
    suivi.fiche = (Array.isArray(data) ? data[0] : data) || false;
    // retrouvée à la main → retenue sur ce téléphone pour la prochaine fois
    if (suivi.fiche && suivi.fiche.reference) retenirResa(suivi.fiche.reference, suivi.tel.trim());
  } catch (ex) { toast(ex.message, true); suivi.fiche = null; }
  suivi.cherche = false; vueSuivi();
}

function brancherFiche() {
  const b = $('#vue').querySelector('[data-annuler]');
  if (!b) return;
  b.addEventListener('click', async () => {
    if (!confirm('Annuler cette réservation ? Le créneau sera libéré.')) return;
    b.disabled = true;
    try {
      const { error } = await sb.rpc('ocr_annuler_reservation',
        { p_reference: suivi.ref.trim(), p_telephone: suivi.tel.trim() });
      if (error) throw error;
      toast('Réservation annulée — à bientôt !');
      await chercherResa();
    } catch (ex) { toast(ex.message, true); b.disabled = false; }
  });
}

/* ==========================================================================
   MON ESPACE — le numéro de téléphone EST le compte, protégé par un code
   à 4 chiffres. Rien n'est perdu en changeant de téléphone : véhicules,
   historique, reçus et fidélité vivent sur le serveur.
   ========================================================================== */
const CLE_JETON = MODE_DEMO ? 'ocr-jeton-demo' : 'ocr-jeton';
const espace = { jeton: null, nom: '', data: null, etape: 'numero',
                 tel: '', pin: '', pin2: '', nomSaisi: '', preuve: '',
                 etat: null, occupe: false, recu: null, reglages: false };
try { espace.jeton = localStorage.getItem(CLE_JETON) || null; } catch (e) {}
const garderJeton = j => { espace.jeton = j; try { j ? localStorage.setItem(CLE_JETON, j) : localStorage.removeItem(CLE_JETON); } catch (e) {} };

async function chargerEspace() {
  if (!espace.jeton) return false;
  const { data, error } = await sb.rpc('ocr_espace_donnees', { p_jeton: espace.jeton });
  if (error || !data) { garderJeton(null); espace.data = null; return false; }
  espace.data = data; espace.nom = data.nom || '';
  espace.etape = 'dedans';
  return true;
}

function vueEspace() {
  if (espace.etape === 'dedans' && espace.data) return vueEspaceDedans();
  return vueEspaceEntree();
}

/* ---------- entrée : un seul champ pour commencer ---------- */
function vueEspaceEntree() {

    ${e.etape === 'activer' ? `

      <div class="ocr-message ocr-message--succes" style="margin-bottom:var(--ocr-e4)"><span>✓</span><div>
        <strong>On te connaît déjà !</strong><br>Vérifions que c'est bien toi, puis choisis ton code.</div></div>
      <label class="ocr-champ">
        <span class="ocr-label">${e.etat && e.etat.indice === 'plaque' ? 'Ta plaque d’immatriculation' : 'Une référence de ton dernier passage'}</span>
        <input class="ocr-saisie${e.etat && e.etat.indice === 'plaque' ? ' plaque' : ''}" id="ePreuve" value="${esc(e.preuve)}"
               placeholder="${e.etat && e.etat.indice === 'plaque' ? OCR.PLAQUE_EXEMPLES.voiture : 'OCR-2608-0042'}"
               autocapitalize="characters">
        <span class="ocr-aide">${e.etat && e.etat.indice === 'plaque'
          ? 'La plaque d’un véhicule que tu nous as déjà confié.'

      ${champsCode('Choisis un code à 4 chiffres', 'Il te servira sur tous tes téléphones.')}
      <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" id="eActiver" ${e.occupe ? 'disabled' : ''}>

    ${e.etape === 'code' ? `

        on le remet à zéro et tu en choisis un nouveau.</p>

  const brancher = (id, fn) => { const b = $('#' + id); if (b) b.addEventListener('click', fn); };
  const lire = () => {
    ['eTel:tel', 'eNom:nomSaisi', 'ePreuve:preuve', 'ePin:pin', 'eCode1:pin', 'eCode2:pin2'].forEach(p => {
      const [id, k] = p.split(':'); const el = $('#' + id); if (el) espace[k] = el.value;
    });
  };
  ['eTel', 'eNom', 'ePreuve', 'ePin', 'eCode1', 'eCode2'].forEach(id => {
    const el = $('#' + id); if (el) el.addEventListener('input', lire);
  });
  // Quand la preuve demandée est une PLAQUE, on la met en forme comme partout
  // ailleurs. Quand c'est une référence (OCR-2608-0042), on n'y touche pas :

  if (e.etat && e.etat.indice === 'plaque') brancherPlaque($('#ePreuve'), v => { espace.preuve = v; });

const champsCode = (label, aide) => `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
    <label class="ocr-champ"><span class="ocr-label">${label}</span>
      <input class="ocr-saisie" id="eCode1" inputmode="numeric" maxlength="4" value="${esc(espace.pin)}"
             placeholder="••••" autocomplete="new-password"
             style="text-align:center;font:700 22px/1.2 var(--ocr-texte);letter-spacing:.4em"></label>
    <label class="ocr-champ"><span class="ocr-label">Confirme-le</span>
      <input class="ocr-saisie" id="eCode2" inputmode="numeric" maxlength="4" value="${esc(espace.pin2)}"
             placeholder="••••" autocomplete="new-password"
             style="text-align:center;font:700 22px/1.2 var(--ocr-texte);letter-spacing:.4em"></label>
  </div>
  <p class="ocr-mini" style="margin:-4px 0 var(--ocr-e4)">${aide}</p>`;

async function etatNumero() {
  if (!espace.tel.trim()) return toast('Écris ton numéro de téléphone.', true);
  espace.occupe = true; vueEspace();
  try {
    const { data, error } = await sb.rpc('ocr_espace_etat', { p_telephone: espace.tel.trim() });
    if (error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    espace.etat = r;
    espace.etape = !r || !r.existe ? 'creer' : r.a_code ? 'code' : 'activer';
  } catch (ex) { toast(ex.message || 'Impossible de vérifier ce numéro', true); }
  espace.occupe = false; vueEspace();
}

function codesOk() {
  if (!/^[0-9]{4}$/.test(espace.pin)) { toast('Le code doit faire 4 chiffres.', true); return false; }
  if (espace.pin !== espace.pin2) { toast('Les deux codes ne sont pas identiques.', true); return false; }
  return true;
}

async function apresEntree(rep) {
  const r = Array.isArray(rep) ? rep[0] : rep;
  if (!r || !r.ok) { toast((r && r.message) || 'Impossible pour l’instant', true); return false; }
  garderJeton(r.jeton);
  espace.nom = r.nom || '';
  espace.pin = ''; espace.pin2 = ''; espace.preuve = '';
  await chargerEspace();
  toast('Bienvenue ' + (espace.nom || '') + ' ✦');
  return true;
}

async function creerEspace() {
  if (!espace.nomSaisi.trim()) return toast('Ton nom est nécessaire.', true);
  if (!codesOk()) return;
  espace.occupe = true; vueEspace();
  try {
    const { data, error } = await sb.rpc('ocr_espace_creer',
      { p_telephone: espace.tel.trim(), p_nom: espace.nomSaisi.trim(), p_pin: espace.pin });
    if (error) throw error;
    await apresEntree(data);
  } catch (ex) { toast(ex.message || 'Création impossible', true); }
  espace.occupe = false; vueEspace();
}

async function activerEspace() {
  if (!espace.preuve.trim()) return toast('Indique ta plaque ou une référence.', true);
  if (!codesOk()) return;
  espace.occupe = true; vueEspace();
  try {
    const { data, error } = await sb.rpc('ocr_espace_activer',
      { p_telephone: espace.tel.trim(), p_pin: espace.pin, p_preuve: espace.preuve.trim() });
    if (error) throw error;
    await apresEntree(data);
  } catch (ex) { toast(ex.message || 'Activation impossible', true); }
  espace.occupe = false; vueEspace();
}

async function ouvrirEspace() {
  if (!/^[0-9]{4}$/.test(espace.pin)) return toast('Le code fait 4 chiffres.', true);
  espace.occupe = true; vueEspace();
  try {
    const { data, error } = await sb.rpc('ocr_espace_ouvrir',
      { p_telephone: espace.tel.trim(), p_pin: espace.pin });
    if (error) throw error;
    await apresEntree(data);
  } catch (ex) { toast(ex.message || 'Connexion impossible', true); }
  espace.occupe = false; vueEspace();
}

    <div class="ocr-carte" style="margin-top:var(--ocr-e4)">
      <div class="ocr-surtitre">Mes lavages</div>
      ${passages.length ? passages.map((p, i) => {
        const presta = (p.lignes || []).filter(l => l.type === 'prestation').map(l => l.libelle).join(' + ');
        const veh = p.vehicule || {};
        const [lab, ton] = ETAT_PAIEMENT[p.statut_paiement] || ['—', 'neutre'];
        return `<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ocr-sep)">

            <span class="ocr-mini">${jourLong(p.journee)}${veh.marque ? ' · ' + esc([veh.marque, veh.modele].filter(Boolean).join(' ')) : ''}</span>
          </span>
          <span style="text-align:right">
            <span style="font:600 14px/1.1 var(--ocr-texte);font-variant-numeric:tabular-nums;display:block">${OCR.fcfa(p.montant_total)}</span>
            <span class="ocr-pastille ocr-pastille--${ton}" style="margin-top:3px">${lab}</span>
          </span>

        </div>`;

    </div>

    <p class="ocr-mini" style="text-align:center;margin-top:var(--ocr-e4)">
      Tes données vivent sur nos serveurs — change de téléphone quand tu veux,
      ton numéro et ton code te les rendent.</p>`;

  $('#eReglages').addEventListener('click', boiteReglagesEspace);
  $('#eAjoutVeh').addEventListener('click', boiteAjoutVehiculeEspace);
  $('#vue').querySelectorAll('[data-nav2]').forEach(b => b.addEventListener('click', () => {
    vue = b.dataset.nav2; rendre(); window.scrollTo(0, 0);
  }));
  $('#vue').querySelectorAll('[data-recu]').forEach(b => b.addEventListener('click', () => {
    espace.recu = passages[Number(b.dataset.recu)];
    vue = 'recu'; rendre(); window.scrollTo(0, 0);
  }));
  $('#vue').querySelectorAll('[data-reserver-veh]').forEach(b => b.addEventListener('click', () => {
    const v = (d.vehicules || []).find(x => String(x.id) === b.dataset.reserverVeh);
    if (!v) return;
    Object.assign(resa, { gabarit: v.gabarit, marque: v.marque || '', modele: v.modele || '',
      immat: v.immatriculation || '', vehChoisi: v.id, nom: d.nom || '', tel: d.telephone || '',
      prestation: null, options: [], heure: null });
    vue = 'reserver'; etape = 1; confirmation = null; rendre(); window.scrollTo(0, 0);
  }));
}

function boiteAjoutVehiculeEspace() {
  let gab = 'berline';
  const v = feuille(`
    <h3 class="ocr-h2">Ajouter un véhicule</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Il sera retrouvé sur tous tes téléphones.</p>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:var(--ocr-e4)" id="avG">
      ${OCR.GABARITS.map(g => `<button class="ocr-chip" data-avg="${g.id}" aria-pressed="${gab === g.id}">${esc(g.court)}</button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Marque</span>
        <input class="ocr-saisie" id="avM" placeholder="Toyota"></label>
      <label class="ocr-champ"><span class="ocr-label">Modèle</span>
        <input class="ocr-saisie" id="avMo" placeholder="RAV4"></label>
    </div>
    <label class="ocr-champ"><span class="ocr-label">Immatriculation</span>
      <input class="ocr-saisie" id="avI" placeholder="${OCR.PLAQUE_EXEMPLES.voiture}">
      <span class="ocr-aide" id="aideAvI">Voiture : ${OCR.PLAQUE_EXEMPLES.voiture} · Moto : ${OCR.PLAQUE_EXEMPLES.moto}</span></label>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e3)">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Ajouter</button></div>`);
  const majAideAvI = () => {
    const a = v.querySelector('#aideAvI');
    if (a) a.innerHTML = aidePlaque(v.querySelector('#avI').value, gab);
  };
  v.querySelectorAll('[data-avg]').forEach(b => b.addEventListener('click', () => {
    gab = b.dataset.avg;
    v.querySelectorAll('[data-avg]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.avg === gab)));
    v.querySelector('#avI').placeholder = gab === 'moto' ? OCR.PLAQUE_EXEMPLES.moto : OCR.PLAQUE_EXEMPLES.voiture;
    majAideAvI();
  }));
  brancherPlaque(v.querySelector('#avI'), majAideAvI);
  v.querySelector('[data-ok]').addEventListener('click', async ev => {
    ev.target.disabled = true;
    const { error } = await sb.rpc('ocr_espace_ajouter_vehicule', {
      p_jeton: espace.jeton, p_gabarit: gab,
      p_marque: v.querySelector('#avM').value.trim() || null,
      p_modele: v.querySelector('#avMo').value.trim() || null,
      p_immat: OCR.plaque(v.querySelector('#avI').value) || null });
    if (error) { toast(error.message, true); ev.target.disabled = false; return; }
    fermerFeuille(v); toast('Véhicule ajouté ✓');
    await chargerEspace(); rendre();
  });
}

function boiteReglagesEspace() {
  const v = feuille(`
    <h3 class="ocr-h2">Mon espace</h3>
    <p class="ocr-mini" style="margin:6px 0 var(--ocr-e4)">${esc(espace.data.telephone || '')}</p>
    <div class="ocr-surtitre">Changer mon code</div>
    <label class="ocr-champ" style="margin-top:var(--ocr-e3)"><span class="ocr-label">Code actuel</span>
      <input class="ocr-saisie" id="ccA" inputmode="numeric" maxlength="4" placeholder="••••"
             style="text-align:center;letter-spacing:.4em"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Nouveau</span>
        <input class="ocr-saisie" id="ccN" inputmode="numeric" maxlength="4" placeholder="••••"
               style="text-align:center;letter-spacing:.4em"></label>
      <label class="ocr-champ"><span class="ocr-label">Confirme</span>
        <input class="ocr-saisie" id="ccN2" inputmode="numeric" maxlength="4" placeholder="••••"
               style="text-align:center;letter-spacing:.4em"></label>
    </div>
    <button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" data-code>Changer mon code</button>
    <p class="ocr-mini" style="margin:8px 0 var(--ocr-e5)">Tes autres téléphones redemanderont le nouveau code.</p>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-sortir style="color:var(--ocr-argent-2)">Me déconnecter de ce téléphone</button>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer style="margin-top:8px">Fermer</button>`);
  v.querySelector('[data-code]').addEventListener('click', async ev => {
    const a = v.querySelector('#ccA').value, n = v.querySelector('#ccN').value, n2 = v.querySelector('#ccN2').value;
    if (!/^[0-9]{4}$/.test(n)) return toast('Le nouveau code fait 4 chiffres.', true);
    if (n !== n2) return toast('Les deux codes ne sont pas identiques.', true);
    ev.target.disabled = true;
    const { error } = await sb.rpc('ocr_espace_changer_code',
      { p_jeton: espace.jeton, p_ancien: a, p_nouveau: n });
    if (error) { toast(error.message, true); ev.target.disabled = false; return; }
    fermerFeuille(v); toast('Code changé ✓');
  });
  v.querySelector('[data-sortir]').addEventListener('click', async () => {
    try { await sb.rpc('ocr_espace_fermer', { p_jeton: espace.jeton }); } catch (e) {}
    garderJeton(null);
    Object.assign(espace, { data: null, nom: '', etape: 'numero', tel: '', pin: '', pin2: '' });
    fermerFeuille(v); toast('Déconnecté'); rendre();
  });
}

/* Une feuille modale légère — l'app de réservation n'en avait pas encore. */
function feuille(html) {
  const v = document.createElement('div');
  v.className = 'voile-espace';
  v.innerHTML = '<div class="ocr-carte boite-espace">' + html + '</div>';
  v.addEventListener('click', e => {
    if (e.target === v || (e.target.closest && e.target.closest('[data-fermer]'))) fermerFeuille(v);
  });
  document.body.appendChild(v);
  history.pushState({ ocrCouche: true }, '');
  return v;
}
/* Referme une feuille (ou le guide d'installation iOS) et dépile l'historique
   qu'elle avait empilé, pour que le geste retour reste toujours cohérent.
   retourInterne évite que ce history.back() « à nous » ne rejoue aussi la
   logique du vrai geste retour (qui renverrait sinon à l'accueil en pleine
   action — même bug que côté Atelier, vu le 12/08). */
function fermerFeuille(v) {
  if (!v || !v.isConnected) return;
  v.remove();
  if (history.state && history.state.ocrCouche) { retourInterne = true; history.back(); }
}
