     neuf. Il la cherchait dans le JavaScript ; la minification réécrit cette

     « Nouvelle version 545981 prête », et un bandeau qui revenait sans fin
     puisque ce nombre n'égalerait jamais « v70 ». Un commentaire HTML, lui,
     traverse la minification sans bouger.
     const VERSION = 'v25' -->
