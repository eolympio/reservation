     traverse la minification sans bouger.

    <!-- LA PORTE QUI MANQUAIT (Edwin, 23/08). « Je fais comment pour retrouver
         la réservation et l'annuler ? je la vois pas. » L'écran « Ma réservation »
         existait, marchait, contenait ses données — et RIEN n'y menait : la seule
         entrée était un bouton enterré dans « Mon espace », derrière un code. Un
         client qui réserve et ferme l'app ne retrouvait jamais son rendez-vous.
         Une pièce sans porte n'est pas une pièce.

         Cet en-tête est du HTML STATIQUE, pas un gabarit JavaScript : le
         `${''/* … */}` qu'on emploie partout ailleurs s'y affiche en toutes
         lettres. Il l'a fait, en gros et en blanc, jusqu'à ce qu'une capture
         d'écran le montre — aucun test ne l'avait vu, parce qu'ils
         interrogeaient le DOM au lieu de REGARDER la page. -->
    <!-- DEUX GESTES, PAS TROIS. Avec « Mon espace » en plus, les trois boutons
         passaient à la ligne sur un écran de 360 px et le logo se retrouvait
         seul au milieu : ça avait l'air cassé, pas conçu. L'en-tête porte donc
         ce qu'un client FAIT — prendre un rendez-vous, retrouver son
         rendez-vous. « Mon espace » n'est pas un geste, c'est un compte : il
         s'ouvre depuis « Ma réservation » et depuis la carte de fidélité de
         l'accueil, là où quelqu'un regarde déjà ses propres affaires. -->
